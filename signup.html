<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management - Sign Up</title>
</head>
<body>
    <header>
        <h1>Create Your Account</h1>
        <nav>
<a href="index.html">Welcome |</a>
<a href="signin.html">Sign In</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registration Form</h2>
            <form action="home.html" method="get">
                <!--
                    MOCKUP ONLY - there is no backend yet, so this form goes nowhere.

                    The password field deliberately has NO `name` attribute, so nothing
                    is submitted and no password can ever end up in a URL. It is kept as
                    type="password" required only to show the real markup shape.

                    BEFORE A BACKEND IS ADDED, all three changes must land together:
                      1. method="get"  -> method="post"
                      2. restore name="..." on the inputs, including the password
                      3. handle the POST server-side with a session (PHP)
                    A password in a query string is written to browser history,
                    sent in the Referer header, and stored in server access logs.
                -->
                <fieldset>
                    <legend>Account Info</legend><br>
                    <label for="firstname">First Name:</label><br>
                    <input type="text" id="firstname" name="firstname" required><br><br>

                    <label for="lastname">Last Name:</label><br>
                    <input type="text" id="lastname" name="lastname" required><br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="password">Password:</label><br>
                    <input type="password" id="password" required><br><br>

                    <label for="major">Major:</label><br>
                    <select id="major" name="major">
                        <option value="cs">Computer Science</option>
                        <option value="cn">Computer Networks</option>
                        <option value="cis">Computer Information Systems</option>
                        <option value="ce">Computer Engineering</option>
                    </select><br><br>
                </fieldset>
                <br>
                <input type="submit" value="Sign Up">
                <input type="reset" value="Clear">
            </form>
        </section>
    </main>

    <footer>
        <hr>
    </footer>
</body>
</html>
