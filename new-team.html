<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management - New Team</title>
</head>
<body>
    <header>
        <h1>New Team</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Sign Out</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Create a Team</h2>
            <form action="home.html" method="get">
                <fieldset>
                    <legend>Team Details</legend><br>
                    <label for="teamname">Team Name:</label><br>
                    <input type="text" id="teamname" name="teamname"><br><br>

                    <label>Members:</label><br>
                    <input type="checkbox" id="m1" name="member" value="Mugdad"><label for="m1">Mugdad</label><br>
                    <input type="checkbox" id="m2" name="member" value="Ali"><label for="m2">Ali</label><br>
                    <input type="checkbox" id="m3" name="member" value="Ahmed"><label for="m3">Ahmed</label><br>
                    <input type="checkbox" id="m4" name="member" value="Hussain"><label for="m4">Hussain</label><br>
                    <input type="checkbox" id="m5" name="member" value="Kumail"><label for="m5">Kumail</label><br><br>
                </fieldset>
                <br>
                <input type="submit" value="Create Team">
                <input type="reset" value="Clear">
            </form>
        </section>
    </main>

    <footer>
        <hr>
    </footer>
</body>
</html>
