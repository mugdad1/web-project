<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management - New Team</title>
</head>
<body>
    <header>
        <h1>New Team</h1>
        <nav>
            <a href="home.html">Home</a> |
            <a href="profile.html">Profile</a> |
            <a href="dashboard.html">Dashboard</a> |
            <a href="index.html">Sign Out</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Create a Team</h2>
            <form action="home.html" method="get">
                <fieldset>
                    <legend>Team Details</legend><br>
                    <label for="teamname">Team Name:</label><br>
                    <input type="text" id="teamname" name="teamname"><br><br>

                    <label for="members">Members:</label><br>
                    <input type="text" id="members" name="members"><br><br>
                </fieldset>
                <br>
                <input type="submit" value="Create Team">
                <input type="reset" value="Clear">
            </form>
        </section>
    </main>

    <footer>
        <hr>
    </footer>
