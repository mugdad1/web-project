<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management - New Team</title>
</head>
<body>
    <header>
        <h1>New Team</h1>
        <nav>
            <a href="home.html">Home |</a>
            <a href="profile.html">Profile |</a>
            <a href="dashboard.html">Dashboard |</a>
            <a href="index.html">Sign Out</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Create a Team</h2>
            <form action="home.html" method="get">
                <fieldset>
                    <legend>Team Details</legend><br>
                    <label for="teamname">Team Name:</label><br>
                    <input type="text" id="teamname" name="teamname" required placeholder="e.g. Team Alpha"><br><br>
                </fieldset>

                <fieldset>
                    <legend>Add Members (email + role)</legend><br>
                    <label for="m1">Member 1 email:</label><br>
                    <input type="email" id="m1" name="m1" placeholder="name@email.com" required>
                    <select id="m1r" name="m1r">
                        <option value="owner">Owner</option>
                        <option value="admin">Admin</option>
                        <option value="member" selected>Member</option>
                        <option value="helper">Helper</option>
                    </select><br><br>

                    <label for="m2">Member 2 email:</label><br>
                    <input type="email" id="m2" name="m2" placeholder="name@email.com">
                    <select id="m2r" name="m2r">
                        <option value="owner">Owner</option>
                        <option value="admin">Admin</option>
                        <option value="member" selected>Member</option>
                        <option value="helper">Helper</option>
                    </select><br><br>

                    <label for="m3">Member 3 email:</label><br>
                    <input type="email" id="m3" name="m3" placeholder="name@email.com">
                    <select id="m3r" name="m3r">
                        <option value="owner">Owner</option>
                        <option value="admin">Admin</option>
                        <option value="member" selected>Member</option>
                        <option value="helper">Helper</option>
                    </select><br><br>

                    <label for="m4">Member 4 email:</label><br>
                    <input type="email" id="m4" name="m4" placeholder="name@email.com">
                    <select id="m4r" name="m4r">
                        <option value="owner">Owner</option>
                        <option value="admin">Admin</option>
                        <option value="member" selected>Member</option>
                        <option value="helper">Helper</option>
                    </select><br><br>

                    <label for="m5">Member 5 email:</label><br>
                    <input type="email" id="m5" name="m5" placeholder="name@email.com">
                    <select id="m5r" name="m5r">
                        <option value="owner">Owner</option>
                        <option value="admin">Admin</option>
                        <option value="member" selected>Member</option>
                        <option value="helper">Helper</option>
                    </select><br><br>
                </fieldset>
                <br>
                <input type="submit" value="Create Team">
                <input type="reset" value="Clear">
            </form>
        </section>
    </main>

    <footer>
        <hr>
    </footer>
</body>
</html>
