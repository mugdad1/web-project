<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Management - Team Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body class="app-shell">
    <aside class="sidebar">
        <div class="workspace">
            <span class="workspace-mark">PM</span>
            <span class="workspace-name">Team Workspace<small>Web Programming</small></span>
        </div>

        <nav class="side-nav" aria-label="Main">
            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="profile.html">Profile</a>
            <a href="settings.html">Settings</a>
        </nav>

        <div class="sidebar-foot">
            <a href="index.html">Sign Out</a>
        </div>
    </aside>

    <div class="app-body">
        <header class="topbar">
            <h1>Team Chat</h1>
            <div class="topbar-actions">
                <div class="avatar-menu">
                    <button type="button" class="avatar" id="avatar-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="avatar-dropdown" aria-label="Account menu">M</button>
                    <div class="avatar-dropdown" id="avatar-dropdown" role="menu" hidden>
                        <a href="profile.html" role="menuitem">My Profile</a>
                        <a href="index.html" role="menuitem">Sign Out</a>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="chat-layout">
                <aside class="card chat-sidebar" aria-labelledby="chat-members-heading">
                    <div class="card-head">
                        <h3 id="chat-members-heading">Members</h3>
                    </div>
                    <ul class="member-list">
                        <li><span>Mugdad</span><span class="tag">Admin</span></li>
                        <li><span>Ali</span><span class="tag">Admin</span></li>
                        <li><span>Ahmed</span><span class="tag">Member</span></li>
                        <li><span>Kumail</span><span class="tag">Member</span></li>
                    </ul>

                    <div class="card-head channel-head">
                        <h3>Channels</h3>
                    </div>
                    <ul class="channel-list">
                        <li><button type="button" class="channel-btn is-active" data-channel="general" aria-pressed="true"># general</button></li>
                        <li><button type="button" class="channel-btn" data-channel="project-updates" aria-pressed="false"># project-updates</button></li>
                    </ul>
                </aside>

                <section class="card chat-room" aria-labelledby="chat-room-heading">
                    <div class="card-head">
                        <h3 id="chat-room-heading">general</h3>
                        <span class="demo-note">Team channel</span>
                    </div>

                    <div id="feed" class="feed"><p class="empty">No messages yet.</p></div>

                    <form id="chat-form" class="chat-form" action="chat.html" method="get" novalidate>
                        <label class="sr-only" for="msg">Message</label>
                        <input type="text" id="msg" name="msg" required placeholder="Write a message...">
                        <button type="submit">Send</button>
                    </form>
                </section>
            </div>
        </main>

        <footer>
            <p>Mugdad, Ali, Ahmed, Kumail</p>
        </footer>
    </div>
</body>
</html>
