<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management - Team Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Team Chat</h1>
        <nav>
<a href="home.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="settings.html">Settings</a>
<a href="index.html">Sign Out</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Members</h2>
            <ul>
                <li>Mugdad</li>
                <li>Ali</li>
                <li>Ahmed</li>
                <li>Kumail</li>
            </ul>
        </section>

        <hr>

        <section>
            <h3>general</h3>
            <div id="feed" class="feed"><p class="empty">No messages yet.</p></div>
        </section>

        <hr>

        <section>
            <h3>Say something</h3>
            <form id="chat-form" action="chat.html" method="get" novalidate>
                <label for="msg">Message:</label><br>
                <input type="text" id="msg" name="msg" required placeholder="Type your message..."><br><br>
                <input type="submit" value="Send">
            </form>
        </section>
    </main>

    <footer>
        <hr>
    </footer>
</body>
</html>
