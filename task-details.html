<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management - Task Details</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Task Details</h1>
        <nav>
<a href="home.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="settings.html">Settings</a>
<a href="index.html">Sign Out</a>
        </nav>
    </header>

    <main>
        <section>
            <h2 id="task-title">Layout skeleton</h2>
            <ul>
                <li>Status: <strong>Completed</strong></li>
                <li>Assigned to: Mugdad</li>
                <li>Priority: High</li>
                <li>Due: 2026-09-20</li>
            </ul>
        </section>

        <hr>

        <section>
            <h3>Notes</h3>
            <ul class="note-list">
                <li>Header, nav and footer done. Passed review.</li>
            </ul>

            <div data-admin-only>
                <form id="note-form" action="task-details.html" method="get">
                    <label for="note-text">Add a note:</label>
                    <textarea id="note-text" name="note" rows="3" required placeholder="Write an update for this task..."></textarea>
                    <button type="submit">Add note</button>
                </form>
            </div>
            <p class="locked-note" id="role-locked" hidden>Only admins can add notes to tasks.</p>
        </section>
    </main>

    <footer>
        <hr>
    </footer>
</body>
</html>
